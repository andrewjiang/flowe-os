name: Firmware Release

on:
  push:
    tags:
      - "fw-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Firmware version (for example, 1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            xphone-os/.pio/build
          key: ${{ runner.os }}-platformio-${{ hashFiles('xphone-os/platformio.ini') }}

      - name: Install PlatformIO and esptool
        run: python -m pip install platformio "esptool>=5,<6"

      - name: Resolve release version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME#fw-v}"
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            VERSION="${DISPATCH_VERSION}"
            RELEASE_TAG="fw-v${VERSION}"
          fi

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"

      - name: Build firmware
        # One env: x3 and x4 are aliases of the same universal image (the
        # firmware picks the panel at boot), so building both doubled CI time
        # to produce identical behavior.
        run: cd xphone-os && pio run -e x3

      - name: Build merged full-flash image
        run: |
          # The web flasher's "clean install" path writes one image at offset
          # 0x0 (bootloader + partition table + app). The primary browser path
          # is an OTA-slot write of update.bin, which keeps the bond; this
          # merged image is for a clean install or a device in an unknown
          # state. otadata is left out on purpose: a full-erase flash blanks
          # it, and the bootloader then boots app0, where the app here lands.
          BUILD=xphone-os/.pio/build/x3
          python -m esptool --chip esp32c3 merge-bin \
            -o dist-full.bin \
            --flash-mode dio --flash-freq 80m --flash-size 16MB \
            0x0 "$BUILD/bootloader.bin" \
            0x8000 "$BUILD/partitions.bin" \
            0x10000 "$BUILD/firmware.bin"

      - name: Stage release assets
        run: |
          # Asset diet (2026-08-25): the image is universal, so the old
          # per-device names (flowe-x3/x4 .bin/.zip, versioned bins) were
          # five copies of the same bytes and confused the release page.
          # What remains, and who reads it:
          #   flowe-firmware.zip  the flash page's Download (SD card path)
          #   update.bin          web flasher Update + bare SD users
          #   flowe-full.bin      web flasher Clean install (offset 0x0)
          #   latest.json         manifest: version, flash params, sha256s
          #   SHA256SUMS.txt      integrity for all of the above
          mkdir -p dist
          cp xphone-os/.pio/build/x3/firmware.bin dist/update.bin
          cp dist-full.bin dist/flowe-full.bin

          # Zip wrapper: a re-downloaded zip gets browser-renamed, but the
          # update.bin inside keeps its exact name. The flash page's single
          # Download button links releases/latest/download/flowe-firmware.zip,
          # so every release must carry it or the button 404s.
          mkdir -p ziproot/flowe-firmware
          cp dist/update.bin ziproot/flowe-firmware/update.bin
          printf '%s\n' \
            'Flowe OS firmware - works on both the Xteink X3 and X4' \
            '' \
            '1. Copy update.bin to the root of the microSD card.' \
            '2. Put the card back in the device.' \
            '3. Hold the left side button and power together until the' \
            '   update screen appears.' \
            '' \
            'Guide: https://www.flowe.ink/flash' \
            > ziproot/flowe-firmware/README.txt
          (cd ziproot && zip -qr ../dist/flowe-firmware.zip flowe-firmware)

          (
            cd dist
            sha256sum \
              flowe-firmware.zip \
              flowe-full.bin \
              update.bin \
              > SHA256SUMS.txt
          )

          RELEASE_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          dist = Path("dist")

          def entry(name: str) -> dict:
              path = dist / name
              return {
                  "file": name,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "size": path.stat().st_size,
              }

          manifest = {
              "version": os.environ["VERSION"],
              "date": os.environ["RELEASE_DATE"],
              "chip": "esp32c3",
              # esptool flash parameters - the web flasher passes these to
              # writeFlash so a browser flash matches the CI merge exactly.
              "flash": {"mode": "dio", "freq": "80m", "size": "16MB"},
              # OTA-slot flash (the primary browser path): flashed into the
              # inactive OTA slot; keeps the bond.
              "app": entry("update.bin"),
              # Clean-install flash: one merged image at offset 0. Wipes NVS
              # (the bond); books on the SD card are untouched.
              "full": {**entry("flowe-full.bin"), "offset": 0},
          }

          (dist / "latest.json").write_text(
              json.dumps(manifest, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Firmware ${{ env.VERSION }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
